<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Wessel Carreiras</title>
<meta name="description" content="Portal de descritivos de cargos da Wessel.">
<link rel="icon" href="assets/logo-wessel.png">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="data.js"></script>
<style>
  :root{
    --vermelho:#E92429;
    --vermelho-esc:#C11B20;
    --tinta:#1b1b1d;
    --tinta-suave:#55555b;
    --tinta-fraca:#8a8a92;
    --linha:#e7e7ea;
    --fundo:#f4f4f6;
    --branco:#ffffff;
    --definir:#b23b3b;
    --raio:12px;
    --sombra:0 1px 2px rgba(0,0,0,.05),0 8px 24px rgba(0,0,0,.06);
    --fonte:"Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif;
  }
  *{box-sizing:border-box}
  html,body{margin:0}
  body{font-family:var(--fonte);color:var(--tinta);background:var(--fundo);line-height:1.5}
  a{color:inherit}
  button{font-family:inherit;cursor:pointer}

  /* Cabecalho */
  header.topo{background:var(--vermelho);color:#fff}
  .topo-inner{max-width:1200px;margin:0 auto;padding:16px 20px;display:flex;align-items:center;gap:16px}
  .topo .logo{background:#fff;border-radius:10px;padding:8px 12px;display:flex;align-items:center;box-shadow:var(--sombra)}
  .topo .logo img{height:38px;display:block}
  .topo h1{font-size:20px;margin:0;font-weight:700;letter-spacing:.2px}
  .topo p{margin:2px 0 0;font-size:13px;opacity:.9}
  .topo .cont{margin-left:auto;text-align:right;font-size:12px;opacity:.92}
  .topo .cont b{font-size:22px;display:block;font-weight:700}

  /* Barra de ferramentas */
  .ferramentas{background:var(--branco);border-bottom:1px solid var(--linha);position:sticky;top:0;z-index:20}
  .ferramentas-inner{max-width:1200px;margin:0 auto;padding:12px 20px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
  .busca{flex:1;min-width:220px;position:relative}
  .busca input{width:100%;padding:11px 14px 11px 40px;border:1px solid var(--linha);border-radius:999px;font-size:15px;outline:none;background:var(--fundo)}
  .busca input:focus{border-color:var(--vermelho);background:#fff}
  .busca svg{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--tinta-fraca)}
  .btn{border:1px solid var(--linha);background:#fff;color:var(--tinta);padding:10px 16px;border-radius:999px;font-size:14px;font-weight:600;display:inline-flex;align-items:center;gap:8px;white-space:nowrap}
  .btn:hover{border-color:var(--tinta-fraca)}
  .btn.primario{background:var(--vermelho);border-color:var(--vermelho);color:#fff}
  .btn.primario:hover{background:var(--vermelho-esc);border-color:var(--vermelho-esc)}

  /* Layout */
  .painel{max-width:1200px;margin:0 auto;padding:20px;display:grid;grid-template-columns:270px 1fr;gap:20px;align-items:start}
  @media(max-width:820px){.painel{grid-template-columns:1fr}}

  /* Menu de areas */
  aside.menu{background:#fff;border:1px solid var(--linha);border-radius:var(--raio);padding:8px;position:sticky;top:74px}
  @media(max-width:820px){aside.menu{position:static}}
  .menu h2{font-size:12px;text-transform:uppercase;letter-spacing:.6px;color:var(--tinta-fraca);margin:10px 12px 6px}
  .area-item>button{width:100%;border:none;background:none;text-align:left;padding:10px 12px;border-radius:8px;display:flex;align-items:center;gap:8px;font-size:14px;font-weight:600;color:var(--tinta)}
  .area-item>button:hover{background:var(--fundo)}
  .area-item>button.ativo{background:var(--vermelho);color:#fff}
  .area-item .qtd{margin-left:auto;font-size:12px;font-weight:700;background:var(--fundo);color:var(--tinta-suave);border-radius:999px;padding:1px 9px}
  .area-item>button.ativo .qtd{background:rgba(255,255,255,.25);color:#fff}
  .setores{padding:2px 0 8px 12px;margin:0;list-style:none}
  .setores li{font-size:13px;color:var(--tinta-suave);padding:5px 12px;border-radius:6px;cursor:pointer}
  .setores li:hover{background:var(--fundo);color:var(--tinta)}
  .setores li.ativo{color:var(--vermelho);font-weight:600}

  /* Lista de cargos */
  .conteudo{min-height:60vh}
  .resumo{font-size:13px;color:var(--tinta-suave);margin:2px 2px 14px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
  .chip{background:#fff;border:1px solid var(--linha);border-radius:999px;padding:4px 12px;font-size:13px;font-weight:600;display:inline-flex;align-items:center;gap:8px}
  .chip button{border:none;background:none;color:var(--tinta-fraca);font-weight:700;padding:0;line-height:1}
  .grade{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px}
  .cartao{background:#fff;border:1px solid var(--linha);border-radius:var(--raio);padding:16px;text-align:left;transition:.12s;display:flex;flex-direction:column;gap:8px}
  .cartao:hover{border-color:var(--vermelho);box-shadow:var(--sombra);transform:translateY(-1px)}
  .cartao .cod{font-size:11px;font-weight:700;color:var(--tinta-fraca);letter-spacing:.5px}
  .cartao .tit{font-size:16px;font-weight:700;color:var(--tinta);margin:0}
  .cartao .meta{margin-top:auto;display:flex;flex-wrap:wrap;gap:6px}
  .tag{font-size:11px;font-weight:600;padding:3px 9px;border-radius:999px;background:var(--fundo);color:var(--tinta-suave)}
  .tag.area{background:#fdeaea;color:var(--vermelho-esc)}
  .vazio{text-align:center;padding:60px 20px;color:var(--tinta-fraca)}

  /* Detalhe (modal) */
  .overlay{position:fixed;inset:0;background:rgba(20,20,22,.5);display:none;z-index:40;padding:20px;overflow:auto}
  .overlay.aberto{display:block}
  .modal{max-width:860px;margin:20px auto;background:#fff;border-radius:16px;box-shadow:0 20px 60px rgba(0,0,0,.3);overflow:hidden}
  .modal-topo{background:var(--vermelho);color:#fff;padding:20px 24px;display:flex;align-items:flex-start;gap:16px}
  .modal-topo .cod{font-size:12px;font-weight:700;opacity:.85;letter-spacing:.5px}
  .modal-topo h2{margin:2px 0 8px;font-size:23px;font-weight:700}
  .modal-topo .badges{display:flex;flex-wrap:wrap;gap:6px}
  .modal-topo .badge{background:rgba(255,255,255,.2);border-radius:999px;padding:3px 11px;font-size:12px;font-weight:600}
  .modal-topo .fechar{margin-left:auto;background:rgba(255,255,255,.15);border:none;color:#fff;width:34px;height:34px;border-radius:50%;font-size:20px;line-height:1;flex:none}
  .modal-topo .fechar:hover{background:rgba(255,255,255,.3)}
  .modal-acoes{display:flex;gap:10px;padding:14px 24px;border-bottom:1px solid var(--linha);flex-wrap:wrap}
  .modal-corpo{padding:8px 24px 28px}
  .secao{padding:18px 0;border-bottom:1px solid var(--linha)}
  .secao:last-child{border-bottom:none}
  .secao h3{font-size:12px;text-transform:uppercase;letter-spacing:.7px;color:var(--vermelho);margin:0 0 12px}
  .campos{display:grid;grid-template-columns:1fr 1fr;gap:14px}
  @media(max-width:640px){.campos{grid-template-columns:1fr}}
  .campo .rot{font-size:12px;font-weight:700;color:var(--tinta-fraca);margin-bottom:2px}
  .campo .val{font-size:15px;color:var(--tinta);white-space:pre-wrap}
  .campo.largo{grid-column:1/-1}
  .lista{margin:0;padding-left:20px}
  .lista li{margin-bottom:6px}
  .adefinir{color:var(--definir);font-style:italic;font-size:14px}

  footer{max-width:1200px;margin:0 auto;padding:24px 20px;color:var(--tinta-fraca);font-size:12px;text-align:center}
</style>
</head>
<body>

<header class="topo">
  <div class="topo-inner">
    <span class="logo"><img src="assets/logo-wessel.png" alt="Wessel"></span>
    <div>
      <h1>Wessel Carreiras</h1>
      <p>Portal de descritivos de cargos</p>
    </div>
    <div class="cont"><b id="contTotal">0</b>cargos cadastrados</div>
  </div>
</header>

<div class="ferramentas">
  <div class="ferramentas-inner">
    <div class="busca">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
      <input id="busca" type="search" placeholder="Buscar por cargo, codigo, setor ou atividade" autocomplete="off">
    </div>
    <button class="btn primario" id="btnExportaBase" title="Baixar toda a base em Excel">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12" y2="3"></line></svg>
      Exportar base completa
    </button>
  </div>
</div>

<div class="painel">
  <aside class="menu">
    <h2>Areas</h2>
    <div id="menuAreas"></div>
  </aside>

  <main class="conteudo">
    <div class="resumo" id="resumo"></div>
    <div class="grade" id="grade"></div>
    <div class="vazio" id="vazio" style="display:none">Nenhum cargo encontrado com esses filtros.</div>
  </main>
</div>

<footer id="rodape"></footer>

<div class="overlay" id="overlay">
  <div class="modal" id="modal" role="dialog" aria-modal="true"></div>
</div>

<script>
const D = window.WESSEL_DATA || {cargos:[], areas:{}, totalCargos:0};
const AD = '<span class="adefinir">a definir</span>';
const estado = {area:null, setor:null, busca:""};

const el = id => document.getElementById(id);
const esc = s => String(s==null?"":s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

function temValor(v){ return Array.isArray(v) ? v.length>0 : (v!=null && String(v).trim()!==""); }
function texto(v){ return temValor(v) ? esc(v) : AD; }
function listaHtml(arr){
  if(!temValor(arr)) return AD;
  return '<ul class="lista">'+arr.map(i=>'<li>'+esc(i)+'</li>').join('')+'</ul>';
}

/* ------- Menu de areas ------- */
function montaMenu(){
  const c = el('menuAreas');
  let html = `<div class="area-item"><button class="${estado.area===null?'ativo':''}" data-area="">Todas as areas<span class="qtd">${D.totalCargos}</span></button></div>`;
  for(const area of Object.keys(D.areas)){
    const qtd = D.cargos.filter(x => (x.area||"").split(";").map(s=>s.trim()).includes(area)).length;
    const aberta = estado.area===area;
    html += `<div class="area-item">
      <button class="${aberta?'ativo':''}" data-area="${esc(area)}">${esc(area)}<span class="qtd">${qtd}</span></button>`;
    if(aberta){
      html += '<ul class="setores">';
      for(const s of D.areas[area]){
        html += `<li class="${estado.setor===s?'ativo':''}" data-setor="${esc(s)}">${esc(s)}</li>`;
      }
      html += '</ul>';
    }
    html += '</div>';
  }
  c.innerHTML = html;
  c.querySelectorAll('[data-area]').forEach(b=>b.onclick=()=>{
    const a = b.dataset.area || null;
    estado.area = (estado.area===a)?null:a; estado.setor=null; render();
  });
  c.querySelectorAll('[data-setor]').forEach(b=>b.onclick=()=>{
    estado.setor = (estado.setor===b.dataset.setor)?null:b.dataset.setor; render();
  });
}

/* ------- Filtro ------- */
function filtra(){
  const q = estado.busca.trim().toLowerCase();
  return D.cargos.filter(c=>{
    if(estado.area && !(c.area||"").split(";").map(s=>s.trim()).includes(estado.area)) return false;
    if(estado.setor && !(c.setores||[]).includes(estado.setor)) return false;
    if(q){
      const alvo = [c.titulo,c.codigo,c.area,(c.setores||[]).join(" "),c.responsabilidades,c.missao].join(" ").toLowerCase();
      if(!alvo.includes(q)) return false;
    }
    return true;
  });
}

/* ------- Render principal ------- */
function render(){
  montaMenu();
  const lista = filtra();
  const grade = el('grade'), vazio = el('vazio');
  const chips = [];
  if(estado.area) chips.push(`<span class="chip">Area: ${esc(estado.area)} <button data-limpa="area">&times;</button></span>`);
  if(estado.setor) chips.push(`<span class="chip">Setor: ${esc(estado.setor)} <button data-limpa="setor">&times;</button></span>`);
  if(estado.busca) chips.push(`<span class="chip">Busca: ${esc(estado.busca)} <button data-limpa="busca">&times;</button></span>`);
  el('resumo').innerHTML = `<span><b>${lista.length}</b> cargo(s)</span>` + chips.join("");
  el('resumo').querySelectorAll('[data-limpa]').forEach(b=>b.onclick=()=>{
    const k=b.dataset.limpa; if(k==='busca'){estado.busca='';el('busca').value='';} else estado[k]=null;
    if(k==='area') estado.setor=null; render();
  });

  if(lista.length===0){ grade.innerHTML=""; vazio.style.display="block"; return; }
  vazio.style.display="none";
  grade.innerHTML = lista.map((c,i)=>`
    <button class="cartao" data-cod="${esc(c.codigo)}">
      <span class="cod">${texto(c.codigo)}</span>
      <h3 class="tit">${esc(c.titulo)||AD}</h3>
      <div class="meta">
        ${(c.area||"").split(";").filter(a=>a.trim()).map(a=>`<span class="tag area">${esc(a.trim())}</span>`).join("")}
        ${temValor(c.nivel)?`<span class="tag">${esc(c.nivel)}</span>`:""}
      </div>
    </button>`).join("");
  grade.querySelectorAll('.cartao').forEach(b=>b.onclick=()=>abre(b.dataset.cod));
}

/* ------- Detalhe ------- */
function achaCargo(cod){ return D.cargos.find(c=>String(c.codigo)===String(cod)); }

function abre(cod){
  const c = achaCargo(cod); if(!c) return;
  const badges = [];
  if(temValor(c.area)) c.area.split(";").forEach(a=>a.trim()&&badges.push(`<span class="badge">${esc(a.trim())}</span>`));
  if(temValor(c.nivel)) badges.push(`<span class="badge">Nivel: ${esc(c.nivel)}</span>`);
  if(temValor(c.status)) badges.push(`<span class="badge">${esc(c.status)}</span>`);

  el('modal').innerHTML = `
    <div class="modal-topo">
      <div>
        <div class="cod">${texto(c.codigo)}</div>
        <h2>${esc(c.titulo)||'Cargo'}</h2>
        <div class="badges">${badges.join("")}</div>
      </div>
      <button class="fechar" id="btnFecha" aria-label="Fechar">&times;</button>
    </div>
    <div class="modal-acoes">
      <button class="btn primario" id="btnExportaCargo">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12" y2="3"></line></svg>
        Exportar este cargo
      </button>
    </div>
    <div class="modal-corpo">
      <div class="secao">
        <h3>Identificacao</h3>
        <div class="campos">
          <div class="campo"><div class="rot">Area</div><div class="val">${texto(c.area)}</div></div>
          <div class="campo"><div class="rot">Setor(es) aplicavel(is)</div><div class="val">${temValor(c.setores)?esc(c.setores.join("; ")):AD}</div></div>
          <div class="campo"><div class="rot">Nivel / Grau</div><div class="val">${texto(c.nivel)}</div></div>
          <div class="campo"><div class="rot">Cargo superior imediato</div><div class="val">${texto(c.superior)}</div></div>
          <div class="campo largo"><div class="rot">Subordinados diretos / indiretos</div><div class="val">${temValor(c.subordinados)?esc((c.subordinados||[]).join("; ")):AD}</div></div>
        </div>
      </div>
      <div class="secao">
        <h3>Missao do cargo</h3>
        <div class="campo"><div class="val">${texto(c.missao)}</div></div>
      </div>
      <div class="secao">
        <h3>Responsabilidades e atividades</h3>
        ${listaHtml(c.responsabilidades && !Array.isArray(c.responsabilidades) ? String(c.responsabilidades).split(/\n|•/).map(s=>s.trim()).filter(Boolean) : c.responsabilidades)}
      </div>
      <div class="secao">
        <h3>Requisitos e competencias</h3>
        <div class="campos">
          <div class="campo"><div class="rot">Escolaridade</div><div class="val">${texto(c.escolaridade)}</div></div>
          <div class="campo"><div class="rot">Experiencia minima</div><div class="val">${texto(c.experiencia)}</div></div>
          <div class="campo largo"><div class="rot">Competencias comportamentais</div><div class="val">${listaHtml(c.comp_comportamentais)}</div></div>
          <div class="campo largo"><div class="rot">Competencias tecnicas</div><div class="val">${listaHtml(c.comp_tecnicas)}</div></div>
          <div class="campo largo"><div class="rot">Treinamentos / NR obrigatorios</div><div class="val">${listaHtml(c.treinamentos)}</div></div>
          <div class="campo"><div class="rot">Requisitos fisicos / ambiente</div><div class="val">${texto(c.requisitos_fisicos)}</div></div>
          <div class="campo"><div class="rot">Viagens / CNH / disponibilidade</div><div class="val">${texto(c.viagens)}</div></div>
        </div>
      </div>
      <div class="secao">
        <h3>Outras observacoes</h3>
        <div class="campo"><div class="val">${texto(c.outras)}</div></div>
      </div>
      <div class="secao">
        <h3>Controle</h3>
        <div class="campos">
          <div class="campo"><div class="rot">Elaborado por</div><div class="val">${texto(c.elaborado_por)}</div></div>
          <div class="campo"><div class="rot">Data de criacao</div><div class="val">${texto(c.data_criacao)}</div></div>
          <div class="campo"><div class="rot">Versao</div><div class="val">${texto(c.versao)}</div></div>
          <div class="campo"><div class="rot">Validado por</div><div class="val">${texto(c.validado_por)}</div></div>
          <div class="campo"><div class="rot">Status</div><div class="val">${texto(c.status)}</div></div>
          <div class="campo"><div class="rot">Ultima atualizacao</div><div class="val">${texto(c.atualizacao)}</div></div>
          <div class="campo largo"><div class="rot">Abas de origem (arquivo antigo)</div><div class="val">${temValor(c.abas_origem)?esc((c.abas_origem||[]).join("; ")):AD}</div></div>
        </div>
      </div>
    </div>`;
  el('btnFecha').onclick = fecha;
  el('btnExportaCargo').onclick = ()=>exportaCargo(c);
  el('overlay').classList.add('aberto');
  document.body.style.overflow='hidden';
}
function fecha(){ el('overlay').classList.remove('aberto'); document.body.style.overflow=''; }
el('overlay').onclick = e => { if(e.target===el('overlay')) fecha(); };
document.addEventListener('keydown', e => { if(e.key==='Escape') fecha(); });

/* ------- Exportacao (SheetJS) ------- */
const CAMPOS_EXPORT = [
  ["codigo","Codigo do Cargo"],["titulo","Titulo do Cargo"],["nivel","Nivel/Grau"],
  ["area","Area"],["setores","Setor(es) Aplicavel(is)"],["superior","Cargo Superior Imediato"],
  ["subordinados","Subordinados Diretos/Indiretos"],["missao","Missao do Cargo"],
  ["responsabilidades","Responsabilidades e Atividades"],["escolaridade","Escolaridade"],
  ["experiencia","Experiencia Minima"],["comp_comportamentais","Competencias Comportamentais"],
  ["comp_tecnicas","Competencias Tecnicas"],["treinamentos","Treinamentos/NR Obrigatorios"],
  ["requisitos_fisicos","Requisitos Fisicos/Ambiente"],["viagens","Viagens/CNH/Disponibilidade"],
  ["outras","Outras Observacoes"],["abas_origem","Abas de Origem"],["elaborado_por","Elaborado por"],
  ["data_criacao","Data de Criacao"],["versao","Versao"],["validado_por","Validado por"],
  ["status","Status"],["atualizacao","Ultima Atualizacao"],
];
function valorPlano(v){
  if(Array.isArray(v)) return v.join("; ");
  return (v==null||String(v).trim()==="") ? "a definir" : String(v);
}
function nomeArquivo(s){ return String(s).normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/[^a-zA-Z0-9]+/g,"_").replace(/^_|_$/g,""); }

function exportaCargo(c){
  const linhas = [["Campo","Conteudo"]];
  CAMPOS_EXPORT.forEach(([k,rot])=>linhas.push([rot, valorPlano(c[k])]));
  const ws = XLSX.utils.aoa_to_sheet(linhas);
  ws['!cols']=[{wch:32},{wch:80}];
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, "Descritivo");
  XLSX.writeFile(wb, "Cargo_"+nomeArquivo(c.titulo||c.codigo)+".xlsx");
}
function exportaBase(){
  const cab = CAMPOS_EXPORT.map(x=>x[1]);
  const linhas = [cab];
  filtra().forEach(c=>linhas.push(CAMPOS_EXPORT.map(([k])=>valorPlano(c[k]))));
  const ws = XLSX.utils.aoa_to_sheet(linhas);
  ws['!cols']=CAMPOS_EXPORT.map(()=>({wch:22}));
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, "Base de Cargos");
  XLSX.writeFile(wb, "Base_de_Cargos_Wessel.xlsx");
}
el('btnExportaBase').onclick = exportaBase;

el('contTotal').textContent = D.totalCargos;
