<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Wessel Carreiras</title>
<meta name="description" content="Portal de descritivos de cargos da Wessel.">
<link rel="icon" href="assets/logo-wessel.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/exceljs/4.4.0/exceljs.min.js"></script>
<script src="data.js"></script>
<style>
  :root{
    --brand:#E92429; --brand-600:#c81a20; --brand-050:#fdecec;
    --ink:#161619; --ink-2:#56565f; --ink-3:#8b8b95;
    --line:#ececef; --line-2:#e2e2e7; --bg:#f6f6f8; --card:#ffffff;
    --definir:#c0392b;
    --r-lg:18px; --r-md:14px; --r-sm:10px;
    --sh-sm:0 1px 2px rgba(20,20,30,.05);
    --sh-md:0 6px 18px rgba(20,20,30,.08);
    --sh-lg:0 24px 60px rgba(20,20,30,.22);
    --font:'Inter',system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;
    --sidebar:264px;
  }
  *{box-sizing:border-box}
  html,body{margin:0}
  body{font-family:var(--font);color:var(--ink);background:var(--bg);line-height:1.55;-webkit-font-smoothing:antialiased}
  button{font-family:inherit;cursor:pointer;border:none;background:none}
  ::selection{background:var(--brand);color:#fff}
  .sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

  /* ===== Cabecalho ===== */
  header.topo{position:sticky;top:0;z-index:30;background:rgba(255,255,255,.86);backdrop-filter:saturate(180%) blur(12px);border-bottom:1px solid var(--line)}
  header.topo::before{content:"";display:block;height:3px;background:var(--brand)}
  .topo-in{max-width:1240px;margin:0 auto;padding:14px 22px;display:flex;align-items:center;gap:16px}
  .lockup{display:flex;align-items:center;gap:13px}
  .lockup img{height:38px;display:block}
  .lockup .sep{width:1px;height:30px;background:var(--line-2)}
  .lockup .tit{font-size:16px;font-weight:800;letter-spacing:-.2px;line-height:1.1}
  .lockup .sub{font-size:12px;color:var(--ink-3);font-weight:500}
  .topo .stat{margin-left:auto;display:flex;align-items:center;gap:9px;font-size:13px;color:var(--ink-2);font-weight:600}
  .topo .stat b{font-size:16px;color:var(--brand);font-weight:800}
  .topo .stat .dot{width:8px;height:8px;border-radius:50%;background:var(--brand);box-shadow:0 0 0 4px var(--brand-050)}

  /* ===== Hero / busca ===== */
  .hero{max-width:1240px;margin:0 auto;padding:26px 22px 6px}
  .hero h2{font-size:26px;font-weight:800;letter-spacing:-.6px;margin:0 0 4px}
  .hero p{margin:0 0 18px;color:var(--ink-2);font-size:14.5px}
  .busca{position:relative;max-width:640px}
  .busca input{width:100%;padding:15px 46px 15px 48px;border:1.5px solid var(--line-2);border-radius:999px;font-size:15.5px;font-family:inherit;outline:none;background:#fff;box-shadow:var(--sh-sm);transition:.16s}
  .busca input:focus{border-color:var(--brand);box-shadow:0 0 0 4px var(--brand-050)}
  .busca .ico{position:absolute;left:17px;top:50%;transform:translateY(-50%);color:var(--ink-3)}
  .busca .limpar{position:absolute;right:8px;top:50%;transform:translateY(-50%);width:30px;height:30px;border-radius:50%;color:var(--ink-3);font-size:18px;display:none;align-items:center;justify-content:center}
  .busca .limpar:hover{background:var(--bg);color:var(--ink)}
  .busca.tem .limpar{display:flex}

  /* ===== Layout ===== */
  .wrap{max-width:1240px;margin:0 auto;padding:22px;display:grid;grid-template-columns:var(--sidebar) 1fr;gap:26px;align-items:start}
  @media(max-width:900px){.wrap{grid-template-columns:1fr;gap:16px}}

  /* ===== Menu de areas ===== */
  aside.menu{position:sticky;top:96px}
  @media(max-width:900px){aside.menu{position:static}}
  .menu .rot{font-size:11px;text-transform:uppercase;letter-spacing:.9px;color:var(--ink-3);font-weight:700;margin:2px 0 10px 6px}
  .menu-lista{display:flex;flex-direction:column;gap:2px}
  @media(max-width:900px){
    .menu .rot{display:none}
    .menu-lista{flex-direction:row;overflow-x:auto;gap:8px;padding:2px 2px 8px;scrollbar-width:none}
    .menu-lista::-webkit-scrollbar{display:none}
    .setores{display:none!important}
  }
  .area-btn{display:flex;align-items:center;gap:10px;width:100%;padding:9px 12px;border-radius:11px;font-size:14px;font-weight:600;color:var(--ink);text-align:left;transition:.13s;white-space:nowrap}
  .area-btn:hover{background:#fff;box-shadow:var(--sh-sm)}
  .area-btn.on{background:var(--ink);color:#fff}
  .area-btn .pip{width:9px;height:9px;border-radius:50%;flex:none;background:var(--ac,#888)}
  .area-btn.on .pip{box-shadow:0 0 0 3px rgba(255,255,255,.22)}
  .area-btn .n{flex:1;overflow:hidden;text-overflow:ellipsis}
  .area-btn .q{font-size:12px;font-weight:700;color:var(--ink-3);background:var(--bg);border-radius:999px;padding:1px 9px}
  .area-btn:hover .q{background:var(--line)}
  .area-btn.on .q{background:rgba(255,255,255,.18);color:#fff}
  .setores{list-style:none;margin:3px 0 8px;padding:2px 0 2px 30px;display:flex;flex-direction:column;gap:1px}
  .setores li{font-size:13px;color:var(--ink-2);padding:6px 12px;border-radius:8px;cursor:pointer;transition:.12s}
  .setores li:hover{background:#fff;color:var(--ink)}
  .setores li.on{color:var(--brand);font-weight:700;background:var(--brand-050)}

  /* ===== Resultados ===== */
  .barra{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:2px 2px 16px}
  .barra .cont{font-size:14px;color:var(--ink-2);font-weight:600}
  .barra .cont b{color:var(--ink);font-weight:800}
  .barra .flex{flex:1}
  .chip{display:inline-flex;align-items:center;gap:7px;background:#fff;border:1px solid var(--line-2);border-radius:999px;padding:5px 6px 5px 12px;font-size:13px;font-weight:600;box-shadow:var(--sh-sm)}
  .chip button{width:20px;height:20px;border-radius:50%;color:var(--ink-3);font-size:15px;display:flex;align-items:center;justify-content:center}
  .chip button:hover{background:var(--bg);color:var(--brand)}
  .btn{display:inline-flex;align-items:center;gap:8px;padding:10px 16px;border-radius:999px;font-size:13.5px;font-weight:700;transition:.14s;white-space:nowrap}
  .btn.ghost{background:#fff;border:1px solid var(--line-2);color:var(--ink);box-shadow:var(--sh-sm)}
  .btn.ghost:hover{border-color:var(--ink-3)}
  .btn.solid{background:var(--brand);color:#fff;box-shadow:0 6px 16px rgba(233,36,41,.28)}
  .btn.solid:hover{background:var(--brand-600)}

  /* ===== Grade de cargos ===== */
  .grade{display:grid;grid-template-columns:repeat(auto-fill,minmax(258px,1fr));gap:15px}
  .card{position:relative;background:var(--card);border:1px solid var(--line);border-radius:var(--r-lg);padding:18px 18px 16px;text-align:left;cursor:pointer;transition:.16s;overflow:hidden;display:flex;flex-direction:column;gap:10px;min-height:132px;animation:sobe .28s ease both}
  .card::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--ac,var(--brand));opacity:.9;transform:translateX(-4px);transition:.16s}
  .card:hover{border-color:transparent;box-shadow:var(--sh-md);transform:translateY(-2px)}
  .card:hover::before{transform:translateX(0)}
  .card .cod{font-size:11px;font-weight:700;letter-spacing:.6px;color:var(--ink-3)}
  .card .tt{font-size:15.5px;font-weight:800;letter-spacing:-.2px;color:var(--ink);text-transform:uppercase;line-height:1.28}
  .card .foot{margin-top:auto;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .tag{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;font-weight:700;padding:4px 10px;border-radius:999px;background:var(--bg);color:var(--ink-2)}
  .tag .pip{width:7px;height:7px;border-radius:50%;background:var(--ac,#888)}
  .card .seta{position:absolute;right:15px;bottom:15px;color:var(--ink-3);opacity:0;transform:translateX(-4px);transition:.16s}
  .card:hover .seta{opacity:1;transform:translateX(0);color:var(--brand)}
  @keyframes sobe{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
  .nada{text-align:center;padding:70px 20px;color:var(--ink-3)}
  .nada svg{color:var(--line-2);margin-bottom:12px}
  .nada b{display:block;color:var(--ink-2);font-size:16px;margin-bottom:4px}

  /* ===== Drawer (detalhe) ===== */
  .backdrop{position:fixed;inset:0;background:rgba(15,15,20,.45);opacity:0;visibility:hidden;transition:.22s;z-index:40}
  .backdrop.open{opacity:1;visibility:visible}
  .drawer{position:fixed;top:0;right:0;height:100%;width:min(760px,100%);background:#fff;box-shadow:var(--sh-lg);transform:translateX(102%);transition:transform .32s cubic-bezier(.4,0,.15,1);z-index:41;display:flex;flex-direction:column}
  .drawer.open{transform:translateX(0)}
  .d-top{background:var(--brand);color:#fff;padding:22px 26px 20px;flex:none}
  .d-top .cod{font-size:12px;font-weight:700;letter-spacing:.6px;opacity:.9}
  .d-top h2{margin:4px 0 12px;font-size:25px;font-weight:800;letter-spacing:-.5px;text-transform:uppercase;line-height:1.15}
  .d-top .badges{display:flex;flex-wrap:wrap;gap:7px}
  .d-top .bdg{background:rgba(255,255,255,.18);border-radius:999px;padding:4px 12px;font-size:12px;font-weight:600;display:inline-flex;align-items:center;gap:6px}
  .d-top .bdg .pip{width:7px;height:7px;border-radius:50%;background:#fff}
  .d-top .x{position:absolute;top:18px;right:20px;width:38px;height:38px;border-radius:50%;background:rgba(255,255,255,.16);color:#fff;font-size:22px;display:flex;align-items:center;justify-content:center;transition:.14s}
  .d-top .x:hover{background:rgba(255,255,255,.32)}
  .d-acts{display:flex;gap:10px;padding:14px 26px;border-bottom:1px solid var(--line);flex:none;flex-wrap:wrap}
  .d-body{overflow-y:auto;padding:6px 26px 34px}
  .sec{padding:20px 0;border-bottom:1px solid var(--line)}
  .sec:last-child{border-bottom:none}
  .sec h3{display:flex;align-items:center;gap:8px;font-size:11.5px;text-transform:uppercase;letter-spacing:.9px;color:var(--brand);font-weight:800;margin:0 0 14px}
  .sec h3::after{content:"";flex:1;height:1px;background:var(--line)}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
  @media(max-width:600px){.grid2{grid-template-columns:1fr}}
  .fld .lb{font-size:11.5px;font-weight:700;color:var(--ink-3);text-transform:uppercase;letter-spacing:.4px;margin-bottom:3px}
  .fld .vl{font-size:15px;color:var(--ink);white-space:pre-wrap}
  .fld.wide{grid-column:1/-1}
  .lista{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:9px}
  .lista li{position:relative;padding-left:22px;font-size:14.5px;color:var(--ink)}
  .lista li::before{content:"";position:absolute;left:2px;top:9px;width:7px;height:7px;border-radius:2px;background:var(--brand);transform:rotate(45deg)}
  .pills{display:flex;flex-wrap:wrap;gap:8px}
  .pill{background:var(--bg);border:1px solid var(--line);border-radius:999px;padding:6px 13px;font-size:13.5px;font-weight:600;color:var(--ink)}
  .adef{color:var(--definir);font-style:italic;font-size:14px;opacity:.9}

  footer{max-width:1240px;margin:0 auto;padding:26px 22px 40px;color:var(--ink-3);font-size:12.5px;text-align:center;border-top:1px solid var(--line);margin-top:14px}
  .toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--ink);color:#fff;padding:11px 20px;border-radius:999px;font-size:13.5px;font-weight:600;box-shadow:var(--sh-lg);opacity:0;transition:.24s;z-index:50;pointer-events:none}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
</style>
</head>
<body>

<header class="topo">
  <div class="topo-in">
    <div class="lockup">
      <img src="assets/logo-wessel.png" alt="Wessel">
      <span class="sep"></span>
      <div>
        <div class="tit">Wessel Carreiras</div>
        <div class="sub">Descritivos de cargos</div>
      </div>
    </div>
    <div class="stat"><span class="dot"></span><b id="stTotal">0</b> cargos</div>
  </div>
</header>

<section class="hero">
  <h2>Encontre um cargo</h2>
  <p>Navegue por area, filtre por setor ou busque pelo nome, codigo ou atividade.</p>
  <div class="busca" id="buscaWrap">
    <span class="ico"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7.5"></circle><line x1="21" y1="21" x2="16.8" y2="16.8"></line></svg></span>
    <input id="busca" type="search" placeholder="Buscar cargo, codigo, setor ou atividade" autocomplete="off" spellcheck="false">
    <button class="limpar" id="btnLimpaBusca" aria-label="Limpar busca">&times;</button>
  </div>
</section>

<div class="wrap">
  <aside class="menu">
    <div class="rot">Areas</div>
    <div class="menu-lista" id="menu"></div>
  </aside>

  <main>
    <div class="barra">
      <span class="cont" id="cont"></span>
      <span id="chips"></span>
      <span class="flex"></span>
      <button class="btn solid" id="btnBase">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12" y2="3"></line></svg>
        Exportar base
      </button>
    </div>
    <div class="grade" id="grade"></div>
    <div class="nada" id="nada" style="display:none">
      <svg width="46" height="46" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="11" cy="11" r="7.5"></circle><line x1="21" y1="21" x2="16.8" y2="16.8"></line></svg>
      <b>Nenhum cargo encontrado</b>
      Ajuste a busca ou os filtros de area e setor.
    </div>
  </main>
</div>

<footer id="rodape"></footer>

<div class="backdrop" id="backdrop"></div>
<aside class="drawer" id="drawer" role="dialog" aria-modal="true" aria-label="Descritivo do cargo"></aside>
<div class="toast" id="toast"></div>

<script>
const D = window.WESSEL_DATA || {cargos:[], areas:{}, totalCargos:0};
const AD = '<span class="adef">a definir</span>';
const CORES = {
  "Produção":"#E92429","Logística":"#2563EB","Comercial":"#059669",
  "Administrativo/Financeiro":"#7C3AED","Manutenção":"#EA580C","Qualidade":"#0891B2",
  "PCP":"#CA8A04","RH":"#DB2777","TI":"#4F46E5","Diretoria":"#475569"
};
const corArea = a => CORES[a] || "#7a7a85";
const estado = {area:null, setor:null, busca:""};

const $ = id => document.getElementById(id);
const esc = s => String(s==null?"":s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fold = s => String(s==null?"":s).normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase();
const tem = v => Array.isArray(v) ? v.length>0 : (v!=null && String(v).trim()!=="");
const txt = v => tem(v) ? esc(v) : AD;
const areasDo = c => (c.area||"").split(";").map(s=>s.trim()).filter(Boolean);
function listaHtml(arr){ return tem(arr) ? '<ul class="lista">'+arr.map(i=>'<li>'+esc(i)+'</li>').join('')+'</ul>' : AD; }
function pillsHtml(arr){ return tem(arr) ? '<div class="pills">'+arr.map(i=>'<span class="pill">'+esc(i)+'</span>').join('')+'</div>' : AD; }
function respLista(c){
  let r = c.responsabilidades;
  if(!Array.isArray(r)) r = String(r||"").split(/\n|•/).map(s=>s.trim()).filter(Boolean);
  return listaHtml(r);
}

/* ===== Menu ===== */
function qtdArea(area){ return D.cargos.filter(c=>areasDo(c).includes(area)).length; }
function montaMenu(){
  const box = $('menu');
  let h = `<button class="area-btn ${estado.area===null?'on':''}" data-area=""><span class="pip" style="--ac:var(--brand)"></span><span class="n">Todas as areas</span><span class="q">${D.totalCargos}</span></button>`;
  for(const area of Object.keys(D.areas)){
    const on = estado.area===area;
    h += `<div><button class="area-btn ${on?'on':''}" data-area="${esc(area)}" style="--ac:${corArea(area)}">
      <span class="pip"></span><span class="n">${esc(area)}</span><span class="q">${qtdArea(area)}</span></button>`;
    if(on){
      h += '<ul class="setores">';
      for(const s of D.areas[area]) h += `<li class="${estado.setor===s?'on':''}" data-setor="${esc(s)}">${esc(s)}</li>`;
      h += '</ul>';
    }
    h += '</div>';
  }
  box.innerHTML = h;
  box.querySelectorAll('[data-area]').forEach(b=>b.onclick=()=>{
    const a=b.dataset.area||null; estado.area=(estado.area===a)?null:a; estado.setor=null; render();
  });
  box.querySelectorAll('[data-setor]').forEach(b=>b.onclick=()=>{
    estado.setor=(estado.setor===b.dataset.setor)?null:b.dataset.setor; render();
  });
}

/* ===== Filtro ===== */
function filtra(){
  const q = fold(estado.busca.trim());
  return D.cargos.filter(c=>{
    if(estado.area && !areasDo(c).includes(estado.area)) return false;
    if(estado.setor && !(c.setores||[]).includes(estado.setor)) return false;
    if(q){
      const alvo = fold([c.titulo,c.codigo,c.area,(c.setores||[]).join(" "),c.responsabilidades,c.missao,(c.comp_comportamentais||[]).join(" ")].join(" "));
      if(!alvo.includes(q)) return false;
    }
    return true;
  });
}

/* ===== Render ===== */
function render(){
  montaMenu();
  const lista = filtra();
  const chips=[];
  if(estado.area) chips.push(`<span class="chip"><span class="pip" style="width:8px;height:8px;border-radius:50%;background:${corArea(estado.area)}"></span>${esc(estado.area)} <button data-l="area">&times;</button></span>`);
  if(estado.setor) chips.push(`<span class="chip">${esc(estado.setor)} <button data-l="setor">&times;</button></span>`);
  if(estado.busca) chips.push(`<span class="chip">"${esc(estado.busca)}" <button data-l="busca">&times;</button></span>`);
  $('cont').innerHTML = `<b>${lista.length}</b> ${lista.length===1?'cargo':'cargos'}`;
  $('chips').innerHTML = chips.join("");
  $('chips').querySelectorAll('[data-l]').forEach(b=>b.onclick=()=>{
    const k=b.dataset.l; if(k==='busca'){estado.busca='';$('busca').value='';$('buscaWrap').classList.remove('tem');} else estado[k]=null;
    if(k==='area') estado.setor=null; render();
  });

  const grade=$('grade'), nada=$('nada');
  if(!lista.length){ grade.innerHTML=""; nada.style.display="block"; return; }
  nada.style.display="none";
  grade.innerHTML = lista.map((c,i)=>{
    const ac = corArea(areasDo(c)[0]||"");
    const tags = areasDo(c).map(a=>`<span class="tag" style="--ac:${corArea(a)}"><span class="pip"></span>${esc(a)}</span>`).join("");
    return `<button class="card" style="--ac:${ac};animation-delay:${Math.min(i*18,260)}ms" data-cod="${esc(c.codigo)}">
      <span class="cod">${txt(c.codigo)}</span>
      <span class="tt">${esc(c.titulo)||AD}</span>
      <span class="foot">${tags}${tem(c.nivel)?`<span class="tag">${esc(c.nivel)}</span>`:""}</span>
      <span class="seta"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><line x1="5" y1="12" x2="19" y2="12"></line><polyline points="12 5 19 12 12 19"></polyline></svg></span>
    </button>`;
  }).join("");
  grade.querySelectorAll('.card').forEach(b=>b.onclick=()=>abre(b.dataset.cod));
}

/* ===== Drawer ===== */
const achaCargo = cod => D.cargos.find(c=>String(c.codigo)===String(cod));
function abre(cod){
  const c = achaCargo(cod); if(!c) return;
  const badges = areasDo(c).map(a=>`<span class="bdg"><span class="pip" style="background:${corArea(a)}"></span>${esc(a)}</span>`);
  if(tem(c.nivel)) badges.push(`<span class="bdg">Nivel: ${esc(c.nivel)}</span>`);
  if(tem(c.status)) badges.push(`<span class="bdg">${esc(c.status)}</span>`);
  $('drawer').innerHTML = `
    <div class="d-top">
      <button class="x" id="dX" aria-label="Fechar">&times;</button>
      <div class="cod">${txt(c.codigo)}</div>
      <h2>${esc(c.titulo)||'Cargo'}</h2>
      <div class="badges">${badges.join("")}</div>
    </div>
    <div class="d-acts">
      <button class="btn solid" id="dExp">

/* ===== Exportacao Excel formatada (ExcelJS) ===== */
const CAMPOS = [
  ["codigo","Codigo do Cargo"],["titulo","Titulo do Cargo"],["nivel","Nivel / Grau"],
  ["area","Area"],["setores","Setor(es) Aplicavel(is)"],["superior","Cargo Superior Imediato"],
  ["subordinados","Subordinados Diretos / Indiretos"],["missao","Missao do Cargo"],
  ["responsabilidades","Responsabilidades e Atividades"],["escolaridade","Escolaridade"],
  ["experiencia","Experiencia Minima"],["comp_comportamentais","Competencias Comportamentais"],
  ["comp_tecnicas","Competencias Tecnicas"],["treinamentos","Treinamentos / NR Obrigatorios"],
  ["requisitos_fisicos","Requisitos Fisicos / Ambiente"],["viagens","Viagens / CNH / Disponibilidade"],
  ["outras","Outras Observacoes"],["abas_origem","Abas de Origem"],["elaborado_por","Elaborado por"],
  ["data_criacao","Data de Criacao"],["versao","Versao"],["validado_por","Validado por"],
  ["status","Status"],["atualizacao","Ultima Atualizacao"],
];
const RED="FFE92429", RED_LT="FFFDECEC", CINZA="FFF3F3F5", LINHA_C="FFE4E4E9", TINTA="FF161619", ZEBRA="FFFAFAFB";
function plano(v){
  if(Array.isArray(v)) return v.join("\n");
  return (v==null||String(v).trim()==="") ? "a definir" : String(v);
}
function ehVazio(v){ return !(Array.isArray(v)?v.length:(v!=null&&String(v).trim()!=="")); }
const bordaFina = {top:{style:"thin",color:{argb:LINHA_C}},left:{style:"thin",color:{argb:LINHA_C}},bottom:{style:"thin",color:{argb:LINHA_C}},right:{style:"thin",color:{argb:LINHA_C}}};
function nomeArq(s){ return String(s).normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/[^a-zA-Z0-9]+/g,"_").replace(/^_|_$/g,""); }

async function baixa(wb, nome){
  const buf = await wb.xlsx.writeBuffer();
  const blob = new Blob([buf], {type:"application/vnd.openxmlformats-officedocument.spreadsheetml.sheet"});
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href=url; a.download=nome; document.body.appendChild(a); a.click();
  setTimeout(()=>{ URL.revokeObjectURL(url); a.remove(); }, 500);
  toast("Excel gerado: "+nome);
}

async function exportaCargo(c){
  const wb = new ExcelJS.Workbook();
  const ws = wb.addWorksheet("Descritivo", {properties:{defaultRowHeight:16}});
  ws.columns = [{width:30},{width:92}];
  // titulo
  ws.mergeCells("A1:B1");
  const t = ws.getCell("A1");
  t.value = (c.titulo||"Cargo").toUpperCase();
  t.font = {name:"Calibri",bold:true,size:16,color:{argb:"FFFFFFFF"}};
  t.fill = {type:"pattern",pattern:"solid",fgColor:{argb:RED}};
  t.alignment = {vertical:"middle",horizontal:"left",indent:1};
  ws.getRow(1).height = 30;
  ws.mergeCells("A2:B2");
  const s = ws.getCell("A2");
  s.value = [c.codigo, (c.area||"").split(";").map(x=>x.trim()).join(" / ")].filter(Boolean).join("   |   ");
  s.font = {name:"Calibri",size:10,italic:true,color:{argb:"FF888892"}};
  s.alignment = {vertical:"middle",horizontal:"left",indent:1};
  ws.getRow(2).height = 20;
  let r = 4;
  for(const [k,rot] of CAMPOS){
    if(k==="titulo") continue;
    const rowLabel = ws.getCell(`A${r}`), rowVal = ws.getCell(`B${r}`);
    rowLabel.value = rot;
    rowLabel.font = {name:"Calibri",bold:true,size:10,color:{argb:TINTA}};
    rowLabel.fill = {type:"pattern",pattern:"solid",fgColor:{argb:CINZA}};
    rowLabel.alignment = {vertical:"top",horizontal:"left",wrapText:true,indent:1};
    rowLabel.border = bordaFina;
    const vazio = ehVazio(c[k]);
    rowVal.value = plano(c[k]);
    rowVal.font = {name:"Calibri",size:11,italic:vazio,color:{argb:vazio?"FFC0392B":TINTA}};
    rowVal.alignment = {vertical:"top",horizontal:"left",wrapText:true,indent:1};
    rowVal.border = bordaFina;
    r++;
  }
  await baixa(wb, "Cargo_"+nomeArq(c.titulo||c.codigo)+".xlsx");
}

async function exportaBase(){
  const lista = filtra();
  const wb = new ExcelJS.Workbook();
  const ws = wb.addWorksheet("Base de Cargos", {views:[{state:"frozen",ySplit:1}]});
  ws.columns = CAMPOS.map(([k,rot])=>({header:rot, key:k, width:[ "responsabilidades","missao","comp_comportamentais","comp_tecnicas","treinamentos","outras"].includes(k)?46:20}));
  const head = ws.getRow(1);
  head.height = 26;
  head.eachCell(cell=>{
    cell.font={name:"Calibri",bold:true,size:11,color:{argb:"FFFFFFFF"}};
    cell.fill={type:"pattern",pattern:"solid",fgColor:{argb:RED}};
    cell.alignment={vertical:"middle",horizontal:"left",wrapText:true,indent:1};
    cell.border=bordaFina;
  });
  lista.forEach((c,idx)=>{
    const row = ws.addRow(CAMPOS.reduce((o,[k])=>{o[k]=plano(c[k]);return o;},{}));
    row.eachCell(cell=>{
      cell.alignment={vertical:"top",horizontal:"left",wrapText:true,indent:1};
      cell.font={name:"Calibri",size:10.5,color:{argb:TINTA}};
      cell.border=bordaFina;
      if(idx%2===1) cell.fill={type:"pattern",pattern:"solid",fgColor:{argb:ZEBRA}};
    });
  });
  ws.autoFilter = {from:{row:1,column:1}, to:{row:1,column:CAMPOS.length}};
  await baixa(wb, "Base_de_Cargos_Wessel.xlsx");
}
$('btnBase').onclick = exportaBase;
